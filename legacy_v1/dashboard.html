        <div id="container">

            <hgroup id="login-title" class="large-margin-bottom">
                <h1 class="login-title-image"></h1>
                <h5></h5>
            </hgroup>

            <div id="form-wrapper">
                <div id="msg_granted"><h5>Configurando Ambiente seguro...</h5></div>
                <div id="form-block" class="scratch-metal">
                    <div id="form-viewport">

                        <form method="post" action="/security/redirect" id="form-login" autocomplete="off" class="input-wrapper blue-gradient glossy" data-id="btnLogin" data-title="Efetuar Login">
                            <input type="hidden" value="" id="login_action" name="action" />
                            <ul class="inputs black-input large">
                                <li><span class="icon-user mid-margin-right" style="padding: 7px; background: transparent url('/assets/img/icons/username-icon.png') center center no-repeat;"></span><input type="text" name="username" id="username" value="" x-webkit-speech="true" speech="true" onspeechchange='$("#password").trigger("focus");' onwebkitspeechchange='$("#password").trigger("focus");' class="input-unstyled" placeholder="Usuário / E-mail"></li>
                                <li><span class="icon-lock mid-margin-right" style="padding: 7px; background: transparent url('/assets/img/icons/password-icon.png') center center no-repeat;"></span><input type="password" name="password" id="password" autocomplete="off" value="" class="input-unstyled" placeholder="Senha de Acesso"></li>
                                <li style="text-align: center; display: none;" class="otp-codes">
                                    <div class="control-group controls">
                                        <input class="input-number required form-control" type="text" id="digit-1" name="digit-1" data-next="digit-2" />

                                    <div class="control-group controls">

                                    <div class="control-group controls">
                                        <input class="input-number required form-control" type="text" id="digit-3" name="digit-3" data-next="digit-4" data-previous="digit-2" />
                                    </div>
                                    <div class="control-group controls">
                                        <input class="input-number required form-control" type="text" id="digit-4" name="digit-4" data-next="digit-5" data-previous="digit-3" />
                                    </div>
                                    <div class="control-group controls">
                                        <input class="input-number required form-control" type="text" id="digit-5" name="digit-5" data-next="digit-6" data-previous="digit-4" />
                                    </div>

                                        <input class="input-number required form-control" type="text" id="digit-6" name="digit-6" data-previous="digit-5" />
                                    </div>
                                </li>
                            </ul>

                            <p class="button-height" style="height: 33px;">
                                <input type="checkbox" checked="checked" name="remind" id="remind" value="1" class="checkbox tiny mid-margin-right disabled" disabled="true">
                                <label for="remind" class='disabled' disabled='true' style="position: absolute; margin-top: -6px; margin-left: -5px; opacity: 0.5">Lembrar meu acesso</label>
                                <button type="submit" class="button glossy float-right" style="float: right;" id="login">Conectar</button>

                        <form method="post" action="" id="form-password" class="input-wrapper orange-gradient glossy" data-id="btnForget" data-title="Esqueceu sua Senha?">

                            <p class="message">
                                Caso não recorde sua senha, preencha o campo abaixo com seu e-mail e enviaremos uma nova para você:                                <span class="block-arrow"><span></span></span>
                            </p>

                            <ul class="inputs black-input large">
                                <li><span class="icon-user mid-margin-right" style="padding: 7px; background: transparent url('/assets/img/icons/username-icon.png') center center no-repeat;"></span><input type="text" name="recovery_user" id="recovery_user" value="" class="input-unstyled" placeholder="Usuário / E-mail" autocomplete="off"></li>
                                <li><span class="icon-mail mid-margin-right" style="padding: 7px; background: transparent url('/assets/img/icons/mail-icon.png') center center no-repeat;"></span><input type="text" name="recovery_mail" id="recovery_mail" value="" class="input-unstyled" placeholder="Seu E-mail" autocomplete="off"></li>
                            </ul>

                            <button type="submit" class="button glossy full-width" id="send-password">Enviar Senha</button>

        <script type="text/javascript" src="/assets/i18n"></script>
        <script type="text/javascript" src="/assets/js/general.js?v=3"></script>
        <script type="text/javascript" src="/assets/js/input.js"></script>
        <script type="text/javascript" src="/assets/js/message.js"></script>
        <script type="text/javascript" src="/assets/js/notify.js"></script>
        <script>
            $(document).ready(function(){
                var doc = $('html').addClass('js-login'),
                container = $('#container'),
                formWrapper = $('#form-wrapper'),
                formBlock = $('#form-block'),
                formViewport = $('#form-viewport'),
                forms = formViewport.children('form'),
                topDoor = $('<div id="top-door" class="form-door door-down door-closed"><div></div></div>').appendTo(formViewport),
                botDoor = $('<div id="bot-door" class="form-door door-down door-closed"><div></div></div>').appendTo(formViewport),
                doors = topDoor.add(botDoor),
                formSwitch = $('<div id="msg_validating" class="validating">&nbsp;</div><div id="form-switch"><span class="button-group"></span></div>').appendTo(formBlock).children(),
                hash = (document.location.hash.length > 1) ? document.location.hash.substring(1) : false,
                centered,currentForm,animInt,maxHeight = false,blocHeight;

                $('#form-login').submit(function(event){
                    var login = $.trim($('#username').val()),
                    pass = $.trim($('#password').val());

                    if (login.length === 0){
                        displayError('Por favor, informe seu Nome de Usuário/E-Mail.','ATENÇÃO','warning');
                        $('#username').focus();
                        return false;
                    }else if (pass.length === 0){
                        formWrapper.clearMessages();
                        displayError('Por favor, informe a sua Senha.','ATENÇÃO','warning');
                        $('#password').focus();
                        return false;
                    }else{

                        if($('li.otp-codes').is(':visible')) {
                            let isDone = true;
                            for (let i = 1; i <= 6; i++) {
                                if (!$('#digit-' + i).val()) {
                                    isDone = false;
                                }
                            }
                            if (!isDone) {
                                displayError('Informe os 6 dígitos de verificação.', 'ATENÇÃO', 'warning');
                                return false;
                            }
                        }

                        let otp_code = '';
                        $('.input-number').each(function() {
                            if($(this).val()) {
                                otp_code += $(this).val();
                            }
                            $(this).attr('disabled', 'disabled');
                        })

                        formWrapper.clearMessages();
                        event.preventDefault();
                        $("#form-switch").fadeOut(100,function(){$(".validating").stop(true,true).fadeIn(100);});
                        $("#username").attr("disabled", true);
                        $("#password").attr("disabled", true);
                        $("#login").attr("disabled", true);
                        $.ajax({
                            type: "POST",
                            dataType: "json",
                            url: "/security/validate",
                            data: {
                                action:     'login',
                                username:    login,
                                password:    pass,
                                otp_code:    otp_code,
                            },
                            success: function(data){
                                if (data && data.logged && !data.error){
                                    $("#login_action").val('LOGIN');
                                    $("#form-login").attr('action','/security/redirect');
                                    formWrapper.clearMessages();
                                    formBlock.fadeOut(100, function(){
                                        $(".validating").stop(true,true).fadeOut(100);
                                        $("#msg_granted").stop(true,true).fadeIn(100);
                                    });
                                    setTimeout(function() {
                                        $("#form-login")[0].submit();
                                    }, 1000);
                                }else{
                                    if(data && data.ask_otp_code) {
                                        displayError('Informe o código de verificação de 2 Fatores!','Hey, vamos autenticar!','warning');
                                        $('.otp-codes').stop(true,true).fadeIn(100, function(){
                                            $('.input-number').each(function() {
                                                $(this).removeAttr('disabled');
                                            });
                                            $(".validating").fadeOut(100,function(){$("#form-switch").stop(true,true).fadeIn(100);});
                                            $("#username").attr("disabled", false);
                                            $("#password").attr("disabled", false);
                                            $("#login").attr("disabled", false);
                                            $('#digit-1').focus();
                                            formViewport.height(215);
                                        });
                                        console.log('ask_otp', data);
                                        return;
                                    }
                                    formWrapper.clearMessages();
                                    displayError((data && data.msg?data.msg:'Ocorreu um Erro interno!'),'ERRO','error');
                                    $(".validating").fadeOut(100,function(){$("#form-switch").stop(true,true).fadeIn(100);});
                                    $("#username").attr("disabled", false);
                                    $("#password").attr("disabled", false);
                                    if($('li.otp-codes').is(':visible')) {
                                        $('.input-number').each(function() {
                                            $(this).removeAttr('disabled');
                                        });
                                        $('#digit-6').focus();
                                    } else {
                                        if(!data || !data.ask_otp_code) {
                                            $("#password").val("").focus();
                                        }
                                    }
                                    $("#login").attr("disabled", false);
                                }
                            },
                            error: function(){
                                formWrapper.clearMessages();
                                displayError('ERR: Ocorreu um Erro interno!','ERRO','error');
                                $(".validating").fadeOut(100,function(){$("#form-switch").stop(true,true).fadeIn(100);});
                                $("#username").attr("disabled", false);
                                $("#password").attr("disabled", false).val("").focus();
                                $("#login").attr("disabled", false);

                                $('.input-number').each(function() {
                                    $(this).removeAttr('disabled');
                                });
                            },
                         },'json');
                    }
                });
                $('#form-password').submit(function(event){
                    var login = $.trim($('#recovery_user').val()),
                    pass = $.trim($('#recovery_mail').val());

                    if (login.length === 0){
                        displayError('Por favor, informe seu Nome de Usuário.','ATENÇÃO','warning');
                        $('#recovery_user').focus();
                        return false;
                    }else if (pass.length === 0){
                        formWrapper.clearMessages();
                        displayError('Por favor, informe o seu E-Mail.','ATENÇÃO','warning');
                        $('#recovery_mail').focus();
                        return false;
                    }else{
                        formWrapper.clearMessages();
                        event.preventDefault();
                        $("#form-switch").fadeOut(100,function(){$(".validating").stop(true,true).fadeIn(100);});
                        $("#recovery_user").attr("disabled", true);
                        $("#recovery_mail").attr("disabled", true);
                        $("#send-password").attr("disabled", true);
                        $.ajax({
                            type: "POST",
                            dataType: "json",
                            url: "/security/forget",
                            data: {
                                action:     'forget',
                                username:    login,
                                email:    pass
                            },
                            success: function(data){
                                if (data && data.logged && !data.error){
                                    $("#login_action").val('LOGIN');
                                    $("#form-login").attr('action','/security/redirect');
                                    formWrapper.clearMessages();
                                    $(".validating").fadeOut(100,function(){$("#form-switch").stop(true,true).fadeIn(100);});
                                    displayError((data && data.msg?data.msg:'As informações foram enviadas para seu e-mail!'),'ATENÇÃO: MENSAGEM','information');
                                    $("#recovery_user").attr("disabled", false);
                                    $("#recovery_mail").attr("disabled", false);
                                    $("#recovery_user").val("");
                                    $("#recovery_mail").val("");
                                    $("#recovery_user").focus();
                                    $("#send-password").attr("disabled", false);
                                    setTimeout(function(){
                                        $("a.btnLogin").trigger("click");
                                    },500);
                                }else{
                                    formWrapper.clearMessages();
                                    displayError((data && data.msg?data.msg:'Ocorreu um Erro interno!'),'ERRO','error');
                                    $(".validating").fadeOut(100,function(){$("#form-switch").stop(true,true).fadeIn(100);});
                                    $("#recovery_user").attr("disabled", false);
                                    $("#recovery_mail").attr("disabled", false);
                                    $("#recovery_user").val("");
                                    $("#recovery_mail").val("");
                                    $("#recovery_user").focus();
                                    $("#send-password").attr("disabled", false);
                                }
                            },
                            error: function(){
                                formWrapper.clearMessages();
                                displayError('ERR: Ocorreu um Erro interno!','ERRO','error');
                                $(".validating").fadeOut(100,function(){$("#form-switch").stop(true,true).fadeIn(100);});
                                $("#recovery_user").attr("disabled", false);
                                $("#recovery_mail").attr("disabled", false);
                                $("#recovery_user").val("");
                                $("#recovery_mail").val("");
                                $("#recovery_user").focus();
                                $("#send-password").attr("disabled", false);                                
                            }
                         },'json');
                    }
                });
                forms.each(function(i){
                    var form = $(this),
                    height = form.outerHeight(),
                    active = (hash === false && i === 1) || (hash === this.id),
                    color = this.className.match(/[a-z]+-gradient/) ? ' '+(/([a-z]+)-gradient/.exec(this.className)[1])+'-active' : '';
                    form.data('height', height);
                    if (maxHeight === false || height > maxHeight){
                        maxHeight = height;
                    }
                    form.data('button', $('<a href="#'+this.id+'" id="a'+this.id+'" class="'+$(this).attr('data-id')+' button anthracite-gradient'+color+(active ? ' active' : '')+'">'+$(this).attr('data-title')+'</a>').appendTo(formSwitch).data('form', form));
                    if (active){
                        currentForm = form;
                        formViewport.height(height);
                    }else{
                        form.hide();
                    }
                });
                blocHeight = formBlock.height()-currentForm.data('height');
                function handleLoginResize(){
                    centered = (container.css('position') === 'absolute');
                    if (!centered){
                        formWrapper.css('min-height', (blocHeight+maxHeight+20)+'px');
                        container.css('margin-top', '');
                    }else{
                        formWrapper.css('min-height', '');
                        if (parseInt(container.css('margin-top'), 10) === 0){
                            centerForm(currentForm, false);
                        }
                    }
                };
                $(window).bind('normalized-resize', handleLoginResize);
                handleLoginResize();
                formSwitch.on('click', 'a', function(event){
                    var link = $(this),
                    form = link.data('form'),
                    previousForm = currentForm;

                    event.preventDefault();
                    if (link.hasClass('active')){
                        return;
                    }
                    forms.each(function(i){
                        var form = $(this),
                        hidden = form.is(':hidden'),
                        height = form.show().outerHeight();
                        form.data('height', height);
                        if (hidden){
                            form.hide();
                        }
                    });
                    formWrapper.clearMessages();
                    if (animInt){
                        clearTimeout(animInt);
                    }
                    formViewport.stop(true);
                    currentForm.data('button').removeClass('active');
                    link.addClass('active');
                    currentForm = form;
                    if (doc.hasClass('csstransitions')){
                        doors.removeClass('door-closed').addClass('door-down');
                        animInt = setTimeout(function(){
                            doors.addClass('door-closed');
                            animInt = setTimeout(function(){
                                previousForm.hide();
                                form.show();
                                centerForm(form, true);
                                formViewport.animate({
                                    height: form.data('height')+'px'
                                }, function(){
                                    doors.removeClass('door-closed');
                                    animInt = setTimeout(function(){
                                        doors.removeClass('door-down');
                                    }, 300);
                                });
                            }, 300);
                        }, 300);
                    }else{
                        topDoor.animate({ top: '0%' }, 300);
                        botDoor.animate({ top: '50%' }, 300, function(){
                            previousForm.hide();
                            form.show();
                            centerForm(form, true);
                            formViewport.animate({
                                height: form.data('height')+'px'
                            }, {
                                step: function(now, fx){
                                    topDoor.hide().show();
                                    botDoor.hide().show();
                                    formSwitch.hide().show();
                                },
                                complete: function(){
                                    topDoor.animate({ top: '-50%' }, 300);
                                    botDoor.animate({ top: '105%' }, 300);
                                    formSwitch.hide().show();
                                }
                            });
                        });
                    }
                });
                centerForm(currentForm, false);
                function centerForm(form, animate, ignore){
                    if (centered){
                        var siblings = formWrapper.siblings().not('.closing'),
                        finalSize = blocHeight+form.data('height');
                        if (ignore){
                            siblings = siblings.not(ignore);
                        }
                        siblings.each(function(i){
                            finalSize += $(this).outerHeight(true);
                        });
                        container[animate ? 'animate' : 'css']({ marginTop: -Math.round(finalSize/2)-101+'px' });
                    }
                };
                function displayError(message,title,icon){
                    var title2 = "ATENÇÃO";
                    var icon2 = "warning";
                    notify(((title)?title:title2), message, {
                            autoClose: true,
                            icon: '/assets/img/'+((icon)?icon:icon2)+'.png'
                    });                    
                };
                function displayLoading(message){
                    var message = formWrapper.message('<strong>'+message+'</strong>', {
                        append: false,
                        arrow: 'bottom',
                        classes: ['blue-gradient', 'align-center'],
                        stripes: true,
                        darkStripes: false,
                        closable: false,
                        animate: false
                    });
                    centerForm(currentForm, true, 'fast');
                    message.bind('endfade', function(event)
                    {
                        centerForm(currentForm, true, message.get(0));

                    }).hide().slideDown('fast');
                };
                $("#form-login #username").focus();
                setTimeout(function(){
                    $("a#aform-login").trigger('click');
                },50);

                $('.input-number').each(function() {
                    $(this).attr('maxlength', 1);
                    $(this).on('keyup', function(e) {
                        let parent = $($(this).parent()).parent();

                        if(e.keyCode === 8 || e.keyCode === 37) {
                            let prev = parent.find('input#' + $(this).data('previous'));

                            if(prev.length) {
                                $(prev).select();
                            }
                        } else if((e.keyCode >= 48 && e.keyCode <= 57) || (e.keyCode >= 65 && e.keyCode <= 90) || (e.keyCode >= 96 && e.keyCode <= 105) || e.keyCode === 39) {
                            let next = parent.find('input#' + $(this).data('next'));

                            if(next.length) {
                                $(next).select();
                            } else {
                                if(parent.closest().data('autosubmit')) {
                                    parent.submit();
                                }
                            }
                        }
                    });
                });
            });
        </script>
    </body>
